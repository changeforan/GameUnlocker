name: Build GameUnlocker Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release metadata
        id: metadata
        run: |
          version=$(sed -n 's/^version=//p' module.prop)
          version_code=$(sed -n 's/^versionCode=//p' module.prop)
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ||
                ! "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Set a valid version (e.g. v2.3.0 or v2.3.0-rc1) and positive versionCode in module.prop."
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match module.prop version $version."
            exit 1
          fi

          base_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          jq -n --arg version "$version" --argjson versionCode "$version_code" \
            --arg zipUrl "$base_url/releases/download/$version/GameUnlocker_$version.zip" \
            --arg changelog "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/changelog.md" \
            '{version: $version, versionCode: $versionCode, zipUrl: $zipUrl, changelog: $changelog}' > release.json
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c

      - name: Build native libraries and controllers
        env:
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          mkdir -p zygisk
          for abi in arm64-v8a armeabi-v7a; do
            cmake -S cpp -B "build/$abi" \
              "-DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake" \
              "-DANDROID_ABI=$abi" \
              -DANDROID_PLATFORM=android-27 \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build "build/$abi" --parallel
            cp "build/$abi/libgameunlocker.so" "zygisk/$abi.so"
          done
          cp build/arm64-v8a/gu_controller gu_controller_arm64
          cp build/armeabi-v7a/gu_controller gu_controller_armv7

      - name: Fetch and verify bundled jq binaries
        run: |
          base_url=https://github.com/jqlang/jq/releases/download/jq-1.7.1
          curl --fail --silent --show-error --location "$base_url/jq-linux-arm64" --output jq_arm64
          curl --fail --silent --show-error --location "$base_url/jq-linux-armhf" --output jq_armv7
          sha256sum --check <<'EOF'
          4dd2d8a0661df0b22f1bb9a1f9830f06b6f3b8f7d91211a1ef5d7c4f06a8b4a5  jq_arm64
          46d18f115cca638efed22b90342d52a84a25ab1bef570551d3a16f7eb065c298  jq_armv7
          EOF
          chmod +x jq_arm64 jq_armv7

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build companion app
        run: |
          mkdir -p app/src/main/assets
          cp webroot/index.html app/src/main/assets/
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk GameUnlockerApp.apk

      - name: Package module ZIP
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir -p dist
          zip -r9 "dist/GameUnlocker_$VERSION.zip" \
            META-INF common webroot zygisk customize.sh module.prop uninstall.sh \
            GameUnlockerApp.apk gu_controller_arm64 gu_controller_armv7 jq_arm64 jq_armv7 \
            README.md LICENSE THIRD_PARTY_NOTICES.md
          cp release.json dist/

      - uses: actions/upload-artifact@v4
        with:
          name: GameUnlocker-${{ steps.metadata.outputs.version }}
          path: dist/
          if-no-files-found: error

  draft-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GameUnlocker-${{ needs.build.outputs.version }}
          path: dist/

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=(--draft --verify-tag --generate-notes)
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$VERSION" "dist/GameUnlocker_$VERSION.zip" dist/release.json \
            --title "GameUnlocker $VERSION" "${flags[@]}"
